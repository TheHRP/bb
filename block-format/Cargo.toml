[workspace]
resolver = "2"
members = ["core", "authoring"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
repository = "https://github.com/TheHRP/bb"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
minicbor = { version = "0.24", default-features = false }
